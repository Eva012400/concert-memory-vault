<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Concert Memory Vault</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <section class="auth-shell" id="authShell">
      <div class="auth-card">
        <div class="auth-hero" aria-hidden="true">
          <div class="wristband">
            <span></span><span></span><span></span><span></span><span></span>
          </div>
          <div class="stage-glow"></div>
        </div>
        <p class="auth-kicker">Concert Memory Vault</p>
        <h1>登录你的演唱会记忆库</h1>
        <p>把每一次尖叫、灯海和散场后的不舍都收好。随时随地，任意设备访问你的演出记录。</p>
        <form class="auth-form" id="authForm">
          <label>邮箱
            <input name="email" type="email" autocomplete="email" required placeholder="you@example.com" />
          </label>
          <label>密码
            <input name="password" type="password" autocomplete="current-password" required minlength="6" placeholder="至少 6 位" />
          </label>
          <button class="submit-wide" type="submit" data-auth-login>登录</button>
          <button class="outline-wide" type="button" id="signupButton">注册新账户</button>
        </form>
        <p class="setup-warning" id="setupWarning" hidden>还没有配置 Supabase。请先在 `supabase-config.js` 填入项目 URL 和 anon key。</p>
      </div>
    </section>

    <main class="phone-shell" aria-live="polite">
      <section class="screen active" id="concertsScreen" data-screen="concerts">
        <div class="search-row">
          <label class="search-box" aria-label="搜索">
            <span class="ui-icon" aria-hidden="true"><svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"></circle><path d="m16.5 16.5 4 4"></path></svg></span>
            <input id="searchInput" type="search" placeholder="搜索艺人、场馆、城市…" />
          </label>
          <button class="filter-toggle" type="button" id="filterToggle" aria-label="筛选演唱会"><svg viewBox="0 0 24 24"><path d="M4 7h10"></path><circle cx="17" cy="7" r="2"></circle><path d="M20 17H10"></path><circle cx="7" cy="17" r="2"></circle></svg></button>
        </div>

        <section class="filter-panel" id="filterPanel" hidden>
          <div class="filter-row">
            <span>排序</span>
            <button class="chip active" type="button" data-sort="newest">最新优先</button>
            <button class="chip" type="button" data-sort="oldest">最早优先</button>
            <button class="chip" type="button" data-sort="artist">艺人名</button>
          </div>
          <div class="filter-row" id="yearChips">
            <span>年份</span>
          </div>
          <div class="filter-row" id="artistChips">
            <span>艺人</span>
          </div>
        </section>

        <section class="concert-grid" id="concertGrid"></section>
      </section>

      <section class="screen" id="calendarScreen" data-screen="calendar">
        <header class="screen-header">
          <h1>演出日历</h1>
          <p><span id="calendarCount">0</span> 场演唱会</p>
        </header>
        <div class="segmented">
          <button class="active" type="button" data-calendar-mode="month">月视图</button>
          <button type="button" data-calendar-mode="year">年视图</button>
        </div>
        <section class="month-card">
          <div class="month-nav">
            <button type="button" id="prevMonth">‹</button>
            <strong id="monthTitle"></strong>
            <button type="button" id="nextMonth">›</button>
          </div>
        </section>
        <section class="calendar-card">
          <div class="weekdays">
            <span>日</span><span>一</span><span>二</span><span>三</span><span>四</span><span>五</span><span>六</span>
          </div>
          <div class="calendar-grid" id="calendarGrid"></div>
        </section>
        <section class="year-calendar" id="yearCalendar" hidden></section>
        <section class="day-events" id="dayEvents"></section>
      </section>

      <section class="screen" id="summaryScreen" data-screen="summary">
        <header class="screen-header row-header">
          <div>
            <h1>数据洞察</h1>
            <p>共 <span id="summaryCount">0</span> 场观演记录</p>
          </div>
          <button class="wrapped-icon-button" type="button" data-nav="wrapped" aria-label="查看年度回顾"><svg viewBox="0 0 24 24"><path d="M20 12v8H4v-8"></path><path d="M2 7h20v5H2z"></path><path d="M12 22V7"></path><path d="M12 7H8.5a2.5 2.5 0 1 1 2.1-3.85L12 7Z"></path><path d="M12 7h3.5a2.5 2.5 0 1 0-2.1-3.85L12 7Z"></path></svg></button>
        </header>
        <section class="insight-grid" id="insightGrid"></section>
        <section class="wide-stat">
          <span>总场次</span>
          <strong id="totalShows">0</strong>
          <small>场演唱会</small>
          <b aria-hidden="true">♪</b>
        </section>
        <section class="stack-card" id="spendStats"></section>
        <section class="stack-card" id="rankingStats"></section>
        <section class="stack-card" id="countryStats"></section>
        <section class="stack-card" id="monthStats"></section>
        <section class="stack-card" id="yearStats"></section>
      </section>

      <section class="screen" id="wrappedScreen" data-screen="wrapped">
        <header class="screen-header">
          <h1>年度回顾</h1>
          <p>你的专属音乐年终总结</p>
        </header>
        <div class="year-tabs" id="wrapYears"></div>
        <section class="wrapped-card" id="wrappedCard"></section>
      </section>

      <section class="screen add-screen" id="addScreen" data-screen="add">
        <header class="form-header">
          <button type="button" class="text-button" data-nav="concerts">取消</button>
          <h1 id="formTitle">记录演唱会</h1>
          <button type="submit" form="concertForm" class="save-pill" data-save-action>保存</button>
        </header>

        <div class="segmented full">
          <button class="active" type="button" data-form-mode="manual">手动记录</button>
          <button type="button" data-form-mode="paste">粘贴导入</button>
        </div>

        <form class="concert-form" id="concertForm">
          <input type="hidden" name="editingId" />
          <section class="form-card poster-row">
            <label class="poster-drop" for="posterInput">
              <img id="posterPreview" alt="" hidden />
              <span id="posterPlaceholder">+</span>
            </label>
            <div>
              <label>演出海报</label>
              <input id="posterInput" name="posterFile" type="file" accept="image/*" />
              <input name="poster" type="hidden" />
              <small>支持 JPG/PNG，建议 3:4 比例。上传后会显示裁切预览。</small>
            </div>
          </section>

          <section class="form-card paste-card" id="pasteCard" hidden>
            <label>票务文字 / CSV</label>
            <textarea id="pasteText" rows="5" placeholder="粘贴票务信息，我会帮你填入表单"></textarea>
            <button type="button" class="outline-wide" id="parsePaste">解析并填入</button>
          </section>

          <section class="form-card fields">
            <label>艺人名 *
              <input name="artist" required placeholder="例：Taylor Swift" />
            </label>
            <label>巡演名称
              <input name="tour" placeholder="例：The Eras Tour" />
            </label>
            <label>演出日期 *
              <input name="date" required type="date" />
            </label>
            <label>场馆
              <input name="venue" placeholder="例：国家体育场，可稍后补充" />
            </label>
            <label>城市
              <input name="city" placeholder="首尔，可稍后补充" />
            </label>
            <label>国家/地区
              <input name="country" placeholder="韩国，可稍后补充" />
            </label>
          </section>

          <section class="form-card fields">
            <div class="two-col">
              <label>票价
                <input name="price" type="number" min="0" step="1" />
              </label>
              <label>货币
                <select name="currency">
                  <option value="KRW">🇰🇷 KRW — 韩元</option><option value="JPY">🇯🇵 JPY — 日元</option><option value="CNY">🇨🇳 CNY — 人民币</option><option value="USD">🇺🇸 USD — 美元</option>
                  <option value="EUR">🇪🇺 EUR — 欧元</option><option value="TWD">🇹🇼 TWD — 新台币</option><option value="HKD">🇭🇰 HKD — 港币</option><option value="GBP">🇬🇧 GBP — 英镑</option>
                </select>
              </label>
            </div>
            <label>记忆碎片
              <textarea name="memory" rows="4" placeholder="写下这场演唱会最难忘的瞬间…"></textarea>
            </label>
          </section>
          <button class="submit-wide" type="submit" data-save-action>保存这场演唱会</button>
        </form>
      </section>

      <section class="screen" id="profileScreen" data-screen="profile">
        <header class="screen-header">
          <h1>我的</h1>
          <p>账户与应用设置</p>
        </header>
        <section class="profile-card">
          <span>当前账号</span>
          <strong id="accountEmail"></strong>
          <button type="button" id="logoutButton">退出登录</button>
        </section>
      </section>

      <nav class="bottom-nav" aria-label="主导航">
        <button class="active" type="button" data-nav="concerts"><span class="nav-icon"><svg viewBox="0 0 24 24"><path d="M9 18V5l12-2v13"></path><circle cx="6" cy="18" r="3"></circle><circle cx="18" cy="16" r="3"></circle></svg></span><small>演唱会</small></button>
        <button type="button" data-nav="calendar"><span class="nav-icon"><svg viewBox="0 0 24 24"><path d="M8 2v4"></path><path d="M16 2v4"></path><rect x="3" y="5" width="18" height="16" rx="2"></rect><path d="M3 10h18"></path></svg></span><small>日历</small></button>
        <button class="add-button" type="button" data-nav="add"><span class="nav-icon"><svg viewBox="0 0 24 24"><path d="M12 5v14"></path><path d="M5 12h14"></path></svg></span><small>添加</small></button>
        <button type="button" data-nav="summary"><span class="nav-icon"><svg viewBox="0 0 24 24"><path d="M4 19V5"></path><path d="M4 19h16"></path><rect x="7" y="11" width="3" height="5"></rect><rect x="12" y="7" width="3" height="9"></rect><rect x="17" y="9" width="3" height="7"></rect></svg></span><small>总结</small></button>
        <button type="button" data-nav="profile"><span class="nav-icon"><svg viewBox="0 0 24 24"><circle cx="12" cy="8" r="4"></circle><path d="M4 21a8 8 0 0 1 16 0"></path></svg></span><small>我的</small></button>
      </nav>
    </main>

    <dialog class="detail-dialog" id="detailDialog">
      <div id="detailContent"></div>
    </dialog>

    <div class="toast" id="toast" role="status"></div>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="supabase-config.js"></script>
    <script src="app.js"></script>
  </body>
</html>
